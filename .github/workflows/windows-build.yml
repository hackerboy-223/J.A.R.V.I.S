name: Windows validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-build.yml"
      - "jarvis/**"
      - "main.py"
      - "packaging/**"
      - "pyproject.toml"
      - "tests/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/windows-build.yml"
      - "jarvis/**"
      - "main.py"
      - "packaging/**"
      - "pyproject.toml"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout source without external actions
        shell: pwsh
        run: |
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin $env:GITHUB_REF
          git checkout --detach FETCH_HEAD

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,test]"

      - name: Compile and test
        shell: pwsh
        run: |
          python -m compileall -q jarvis tests
          python -m unittest discover -s tests -v
          python -m jarvis selftest
          python -m jarvis package-doctor
          python -m ruff check jarvis tests

      - name: Build portable package for pull request
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./packaging/build-windows.ps1 -SkipInstaller -SkipTests

      - name: Build Windows installer
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          ./packaging/build-windows.ps1 -SkipTests

      - name: Print package checksums
        shell: pwsh
        run: Get-Content dist/SHA256SUMS.txt
