name: Windows executable

on:
  push:
    branches:
      - python-agent-rewrite
    paths:
      - ".github/workflows/windows-build.yml"
      - "jarvis/**"
      - "main.py"
      - "packaging/**"
      - "pyproject.toml"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and packager
        run: python -m pip install --upgrade pip && python -m pip install -e ".[build]"

      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -v
          python -m jarvis.selftest

      - name: Build and archive Windows app
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64
          path: dist/JARVIS-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14