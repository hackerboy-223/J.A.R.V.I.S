[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-desktop"
version = "0.2.0"
description = "J.A.R.V.I.S. desktop agent for H@CKERBOY"
requires-python = ">=3.11,<3.15"
dependencies = [
  "PySide6>=6.11,<6.12",
  "httpx>=0.28,<1",
  "huggingface_hub>=0.35",
  "python-dotenv>=1.0,<2",
  "psutil>=6,<8",
  "pyttsx3>=2.98,<3",
  "sounddevice>=0.5.6,<0.6",
  "numpy>=2,<3",
  "faster-whisper>=1.1,<2",
  "platypush-vosk==0.3.45.post2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "croniter>=6,<7",
  "mcp>=2.3,<3",
  "mss>=10,<11",
  "keyring>=25.6,<26",
  "pywin32>=311; platform_system == 'Windows'",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.14,<7",
]
test = [
  "pytest>=8.4",
  "pytest-qt>=4.5",
  "hypothesis>=6.140",
  "ruff>=0.13",
]
desktop-automation = [
  "pywinauto>=0.6.9",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.ruff]
line-length = 100
target-version = "py311"
