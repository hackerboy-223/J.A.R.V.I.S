[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-desktop"
version = "0.1.0"
description = "J.A.R.V.I.S. desktop agent for H@CKERBOY"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "psutil>=6.0",
  "pyttsx3>=2.98",
  "sounddevice>=0.5",
  "numpy>=2.0",
  "faster-whisper>=1.1",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.ruff]
line-length = 100
target-version = "py311"
