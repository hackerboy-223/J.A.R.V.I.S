[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-desktop"
version = "0.1.0"
description = "J.A.R.V.I.S. desktop agent for H@CKERBOY"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "httpx>=0.27",
  "huggingface_hub>=0.35",
  "python-dotenv>=1.0",
  "psutil>=6.0",
  "pyttsx3>=2.98",
  "sounddevice>=0.5",
  "numpy>=2.0",
  "faster-whisper>=1.1",
  "platypush-vosk>=0.3.45.post2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "croniter>=6.0",
  "mcp>=2.3,<3",
  "mss>=10.0",
  "keyring>=25.6",
  "pywin32>=311; platform_system == 'Windows'",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.14,<7",
]
test = [
  "pytest>=8.4",
  "pytest-qt>=4.5",
  "hypothesis>=6.140",
  "ruff>=0.13",
]
desktop-automation = [
  "pywinauto>=0.6.9",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.ruff]
line-length = 100
target-version = "py311"
